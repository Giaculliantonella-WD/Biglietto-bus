<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./main.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="container">

        <div class="card shadow">
            <div class="card-header bg-primary text-white ">
                <h1>Calcola il tuo biglietto</h1>
            </div>
            <div class="card-body">
                <form action="" autocomplete="off">
                    <div class="row g-3">
                        <div class="col-4">
                            <input class="form-control" placeholder="Nome e Cognome" type="text" id="name-field">
                        </div>
                        <div class="col-4">
                            <input class="form-control" type="number" id="km" placeholder="inserisci i km">
                        </div>
                        <div class="col-4">
                            <input class="form-control" placeholder=" età" id="age" type="text">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-3 my-4">
                        <button id="button-generate" type="submit" class="btn btn-primary">Genera</button>

                    </div>
                </form>
                <div class="risultato container mt-4 p-5">
                    <div class="row text-center">
                        <div class="col-4">
                            <h5>Nome Passeggero</h5>
                            <p id="ticket-name"></p>
                        </div>


                        <div class="col-4">
                            <h4>Offerta</h4>
                            <p id="ticket-offer">-</p>
                        </div>
                        <div class="col-4">
                            <h4>Costo Biglietto</h4>
                            <p id="ticket-price">-</p>
                        </div>

                    </div>
                    <div class="d-flex justify-content-center mt-4">
                        <button id="button-reset" type="reset" class="btn btn-secondary">Resetta</button>
                    </div>
                </div>
            </div>


        </div>





    </div>
















































































</body>

</html>
